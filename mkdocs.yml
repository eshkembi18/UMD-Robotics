# ---------------------------------------------------------------
# Generalist Robotics — documentation site configuration
# Content lives in docs/. This file only controls the site itself.
# Adding a page? Create the .md file AND add it to `nav:` below.
# ---------------------------------------------------------------
site_name: Generalist Robotics
site_description: SO-101 / LeRobot documentation and knowledge base — UM-Dearborn Senior Design
site_url: https://eshkembi18.github.io/UMD-Robotics/   # [TEAM VERIFICATION REQUIRED]
repo_url: https://github.com/eshkembi18/UMD-Robotics
repo_name: UMD-Robotics
edit_uri: edit/main/docs/
copyright: Generalist Robotics Senior Design Team — University of Michigan–Dearborn

theme:
  name: material
  language: en
  icon:
    logo: material/robot-industrial
    repo: fontawesome/brands/github
  favicon: assets/images/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.path          # breadcrumbs
    - navigation.footer        # previous / next links
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.tabs.link

extra_css:
  - assets/stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true        # build fails if an included file is missing
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: info
    unrecognized_links: warn

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/eshkembi18/UMD-Robotics

