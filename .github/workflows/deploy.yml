name: docs

# PRs: build with --strict (fails on broken links / missing pages).
# main: build + deploy to GitHub Pages.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - name: Build (strict)
        run: mkdocs build --strict
      - name: Placeholder report (informational, never fails)
        run: python scripts/find_placeholders.py --summary || true
      - name: Check external links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --exclude-path site './docs/**/*.md'
          fail: false          # report only; external sites go down sometimes
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
